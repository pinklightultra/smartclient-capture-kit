name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      matrix:
        # ubuntu-latest is Ubuntu 26.04. Playwright 1.60 has no Chromium build for it.
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run smoke
